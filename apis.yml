description: Excelero was a software-defined storage company whose flagship product, NVMesh, delivered distributed,
  low-latency shared NVMe block storage across a server cluster with a Kubernetes CSI driver and a management CLI.
  Excelero was acquired by NVIDIA in 2022 and no longer operates as an independent company; its NVMesh product and
  documentation are now part of NVIDIA. The former excelero.com domain 301-redirects to nvidia.com/en-us/excelero/.
  This profile was surfaced as a battery-ventures portfolio company; the enrichment pipeline found no independent
  Excelero API, OpenAPI specification, or developer portal to harvest.
